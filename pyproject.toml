[project]
name = "ha-yachtsense-link"
version = "0.0.3" # x-release-please-version
description = "Home Assistant integration for the Raymarine YachtSense Link marine router."
requires-python = ">=3.14.4,<3.15"
dependencies = []

[dependency-groups]
test = [
  "pytest-homeassistant-custom-component>=0.13.323",
]
dev = [
  { include-group = "test" },
  "mypy>=1.20.0",
]

[tool.mypy]
mypy_path = ["custom_components"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
required-version = "==0.12.*"
package = false
